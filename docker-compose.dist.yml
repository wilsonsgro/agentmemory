services:

  ollama-memoryagent:
      build:
        context: ..
        dockerfile: ollama-memoryagent/Dockerfile
      container_name: ollama-memoryagent
      restart: unless-stopped
      environment:
          OLLAMA_HOST: 0.0.0.0:11435
          OLLAMA_KEEP_ALIVE: 0s
          OLLAMA_NUM_PARALLEL: 1
          OLLAMA_MAX_LOADED_MODELS: 1
          OLLAMA_MODEL: ${OLLAMA_ENGINE_MODEL:-qwen2.5:3b-instruct}
      ports:
          - "11435:11435"
      volumes:
          - ollama-memoryagent:/root/.ollama
          - ../src/ollama-memoryagent:/docker-entrypoint-init.d:ro
      deploy:
          resources:
              reservations:
                  devices:
                      - driver: nvidia
                        count: all
                        capabilities: [gpu]
      healthcheck:
          test: ["CMD", "curl", "-fsS", "http://localhost:11435/api/tags"]
          interval: 15s
          timeout: 5s
          retries: 20
          start_period: 20s
      extra_hosts:
        - "host.docker.internal:host-gateway"

  iii-engine:
    # Pinned to v0.11.2 — the last engine that runs agentmemory's current
    # worker model cleanly. v0.11.6 introduces a new sandbox-everything-
    # via-`iii worker add` model that agentmemory hasn't been refactored
    # for yet; the architectural mismatch surfaces as EPIPE reconnect
    # loops and empty search after save. Bump only after agentmemory is
    # refactored to register as a sandboxed worker.
    #
    # Override per-shell or via .env file:
    #   AGENTMEMORY_III_VERSION=0.11.7 docker compose up
    image: iiidev/iii:${AGENTMEMORY_III_VERSION:-0.11.2}
    user: root
    ports:
      - "49134:49134"
      - "3111:3111"
      - "13112:3112"
      - "9464:9464"
    volumes:
      - iii-data:/data
      - ./iii-config.docker.yaml:/app/config.yaml:ro
    restart: unless-stopped

volumes:
  ollama-memoryagent: {}
  iii-data:
